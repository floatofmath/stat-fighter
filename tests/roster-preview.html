<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Stat Fighter visual review</title><style>body{background:#080c13;color:#ddd;font:14px/1.6 monospace;margin:20px}button,a{background:#14212c;color:#edc871;border:1px solid #48616e;padding:12px;cursor:pointer}main{display:flex;flex-wrap:wrap;gap:20px}iframe{display:block;width:390px;height:844px;border:1px solid #48616e}h2{font-size:16px}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}</style>
<h1>Stat Fighter visual review</h1><p>Actual app at phone/desktop viewport widths. Scroll inside each frame. These previews do not replace physical-device testing.</p><nav aria-label="Viewport width"><button data-width="320">320px</button><button data-width="390">390px</button><button data-width="768">768px</button><button data-width="1280">1280px</button></nav><nav aria-label="Screen"><button data-screen="profile">Profiles</button><button data-screen="arena">Arenas / alternate inputs</button><a href="../index.html#select">Open Quick Select</a></nav><p id="state" role="status">390px / profiles</p><main></main>
<script>
const heroes=[['two-sample','Maverick','means'],['paired','Mirror','differences'],['one-sample','Iwan','means'],['anova','Nova','means'],['correlation','Volt','covariance'],['regression','Vector','r-squared'],['mann-whitney','Rook','probability'],['signed-rank','Echo','normal-shift'],['proportions','Pip','proportions'],['chi-square','Chi','table'],['log-rank','Harbor','hazard-ratio'],['bonferroni','Aegis','means'],['non-inferiority','Bastion','means'],['tost','Tess','means'],['tost-lognormal','Ratio','log']];let width=390,screen='profile';
const main=document.querySelector('main');const equivalence=new URLSearchParams(location.search).has('equivalence');const remaining=equivalence||new URLSearchParams(location.search).has('remaining');if(remaining){width=320;screen='arena'}for(const[id,name,mode]of (equivalence?heroes.slice(12):remaining?heroes.slice(6):heroes)){const section=document.createElement('section'),h=document.createElement('h2'),iframe=document.createElement('iframe');h.textContent=name;if(remaining)iframe.style.height='480px';iframe.title=name+' preview';iframe.dataset.id=id;iframe.dataset.mode=mode;section.append(h,iframe);main.append(section)}
function render(){for(const f of document.querySelectorAll('iframe')){f.style.width=width+'px';f.src='../index.html#'+screen+'?test='+f.dataset.id+(screen==='arena'?'&v=1&mode='+f.dataset.mode+'&run=1':'')}document.querySelector('#state').textContent=width+'px / '+screen}
document.onclick=e=>{if(e.target.dataset.width)width=Number(e.target.dataset.width);else if(e.target.dataset.screen)screen=e.target.dataset.screen;else return;render()};render();
</script></html>
